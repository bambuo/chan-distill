[package]
name = "chan_distill_rs"
version = "0.1.0"
edition = "2024"
description = "Chan-Distill (缠论蒸馏) — 纯 Rust 端到端缠论信号模型"
authors = ["chan-distill"]
repository = "https://github.com/waditu/chan-distill-rs"
license = "MIT"

# ─── 编译优化 ───────────────────────────────
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# ─── 依赖 ───────────────────────────────────
[dependencies]

# 缠论核心算法
czsc-core = "1.0.0-rc.8"

# 深度学习框架 (HuggingFace Candle)
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-onnx = "0.10.2"

# ONNX Runtime 推理
ort = "2.0.0-rc.12"

# 数据操作
csv = "1.3"
polars = { version = "0.45", features = ["parquet", "lazy"] }
chrono = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 其他工具
log = "0.4"
env_logger = "0.11"
rayon = "1"
rand = "0.8"
glob = "0.3"

[features]
default = ["metal"]
metal = ["candle-core/metal"]   # macOS MPS (Metal) 加速
cuda = ["candle-core/cuda"]     # NVIDIA GPU 加速
